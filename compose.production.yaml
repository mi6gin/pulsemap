name: pulsemap-production

services:
  app:
    build:
      context: .
    env_file:
      - .env.production
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      RUN_MIGRATIONS: "true"
      SEED_DEMO_USER: "true"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["php", "artisan", "queue:work", "--queue=default", "--tries=4", "--timeout=180", "--sleep=2"]
    env_file:
      - .env.production
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pulsemap}
      POSTGRES_USER: ${DB_USERNAME:-pulsemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pulsemap} -d ${DB_DATABASE:-pulsemap}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
